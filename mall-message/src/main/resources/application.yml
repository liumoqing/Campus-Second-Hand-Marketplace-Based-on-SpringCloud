server:
  port: 4405

spring:
  application:
    name: mall-message
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mall_message?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: mall_app
    password: Mall@2026
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

mall:
  internal:
    token: mall-internal-2026
  jwt:
    # 与网关保持一致（WS 握手自己验签）
    secret: qingchuan-mall-jwt-secret-key-please-change-in-production-2026
  upload:
    dir: ${user.home}/mall-upload
    base-url: http://127.0.0.1:4402

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.campus.mall: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"