global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mall-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:4399']
        labels:
          application: mall-gateway
  - job_name: mall-auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:4400']
        labels:
          application: mall-auth
  - job_name: mall-user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:4401']
        labels:
          application: mall-user
  - job_name: mall-product
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:4402']
        labels:
          application: mall-product
  - job_name: mall-order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:4403']
        labels:
          application: mall-order
  - job_name: mall-payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:4404']
        labels:
          application: mall-payment
  - job_name: mall-message
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:4405']
        labels:
          application: mall-message
