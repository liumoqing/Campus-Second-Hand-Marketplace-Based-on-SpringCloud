server:
  port: 4399

spring:
  application:
    name: mall-gateway
  config:
    import:
      - "optional:nacos:mall-common.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true"
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        refresh-enabled: true
    sentinel:
      eager: true
      web-context-unify: false
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: 8720
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: mall-auth
              uri: lb://mall-auth
              predicates:
                - Path=/auth/**,/oauth2/**,/.well-known/**,/login
            - id: mall-user
              uri: lb://mall-user
              predicates:
                - Path=/user/**
            - id: mall-runtime-config
              uri: lb://mall-user
              predicates:
                - Path=/config/runtime
            - id: mall-product
              uri: lb://mall-product
              predicates:
                - Path=/product/**,/category/**,/favorite/**,/files/**,/static/**
            - id: mall-order
              uri: lb://mall-order
              predicates:
                - Path=/order/**
            - id: mall-payment
              uri: lb://mall-payment
              predicates:
                - Path=/payment/**
            - id: mall-message
              uri: lb://mall-message
              predicates:
                - Path=/message/**,/ws/**

mall:
  jwt:
    # 与 mall-auth 的 mall.jwt.secret 必须一致；生产改环境变量
    secret: qingchuan-mall-jwt-secret-key-please-change-in-production-2026
    access-token-minutes: 120
  security:
    auth-enabled: true
    # OAuth2 资源服务器用 mall-auth 的公钥验签；本地默认直连 4400
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://127.0.0.1:4400/oauth2/jwks}
  internal:
    # 服务间调用凭据，与各服务的 mall.internal.token 保持一致
    token: mall-internal-2026

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.campus.mall: debug
    org.springframework.cloud.gateway: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
