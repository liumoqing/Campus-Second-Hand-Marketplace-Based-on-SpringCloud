server:
  port: 4400

spring:
  application:
    name: mall-auth
  config:
    import:
      - "optional:nacos:mall-common.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true"
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        refresh-enabled: true
    sentinel:
      eager: true
      web-context-unify: false
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: 8721
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # A8 注册头像：≤2MB；超出由 Service 与本上限双重拦截
      max-file-size: 2MB
      max-request-size: 5MB

mall:
  security:
    downstream-enabled: false
  oauth2:
    issuer: ${OAUTH2_ISSUER:http://127.0.0.1:4400}
  jwt:
    secret: qingchuan-mall-jwt-secret-key-please-change-in-production-2026
    access-token-minutes: 120
    refresh-token-days: 7
  internal:
    token: mall-internal-2026
  upload:
    dir: ${user.dir}/.tmp/uploads
    base-url: http://127.0.0.1:4402
  captcha:
    enabled: true
    expire-seconds: 120
  reset:
    # 开发期把验证码回显给前端；生产置 false
    code-echo: true
    expire-seconds: 600

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.campus.mall: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
